global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: '/api/metrics'

  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:3001']
    metrics_path: '/metrics'

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:3002']
    metrics_path: '/metrics'
  # Built-in rabbitmq_prometheus plugin (enabled in the official image).
  # queue_coarse_metrics = per-queue ready/unacked counts, including
  # the *.retry and *.dlq queues.
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: '/metrics/detailed'
    params:
      family: ['queue_coarse_metrics']
